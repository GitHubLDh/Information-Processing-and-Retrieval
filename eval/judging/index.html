<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRI M2 — manual relevance judging</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#627083; --line:#dfe4ea;
          --g0:#c0392b; --g1:#c98a12; --g2:#1e8449; --accent:#2457a6; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         color:var(--ink); background:var(--bg); }
  header { position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line);
           padding:12px 18px; box-shadow:0 1px 8px rgba(0,0,0,.05); }
  h1 { font-size:19px; margin:0 0 4px; }
  .muted { color:var(--muted); }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
  .toolbar button, .toolbar label, .toolbar select, .toolbar input[type=text] {
    font:inherit; padding:5px 9px; border:1px solid var(--line); border-radius:6px; background:#fff;
  }
  .toolbar button { cursor:pointer; }
  .toolbar button:hover { border-color:var(--accent); color:var(--accent); }
  .bar { height:7px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:10px; }
  .bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .15s; }
  main { max-width:1050px; margin:0 auto; padding:16px 18px 80px; }
  .need { background:#eef3fb; border:1px solid #cfdcf2; border-radius:8px; padding:10px 14px; margin:0 0 14px; }
  .need h2 { font-size:16px; margin:0 0 4px; }
  .need p { margin:4px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:9px; padding:14px 16px;
          margin-bottom:12px; }
  .card.done { border-left:5px solid var(--accent); }
  .card h3 { margin:0 0 2px; font-size:16px; }
  .meta { color:var(--muted); font-size:13px; margin-bottom:8px; }
  .evidence { margin:8px 0; }
  .evidence h4 { margin:8px 0 3px; font-size:13px; text-transform:uppercase; letter-spacing:.04em;
                 color:var(--muted); }
  .evidence ul { margin:0; padding-left:20px; }
  .evidence li { margin:3px 0; }
  .overview { background:#fafbfc; border:1px solid var(--line); border-radius:6px; padding:7px 9px; }
  .grades { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px;
            padding-top:10px; border-top:1px dashed var(--line); }
  .grade { cursor:pointer; border:1px solid var(--line); border-radius:6px; padding:6px 12px;
           background:#fff; font-weight:600; }
  .grade[data-rel="0"]:hover, .grade[data-rel="0"].active { background:var(--g0); color:#fff; border-color:var(--g0); }
  .grade[data-rel="1"]:hover, .grade[data-rel="1"].active { background:var(--g1); color:#fff; border-color:var(--g1); }
  .grade[data-rel="2"]:hover, .grade[data-rel="2"].active { background:var(--g2); color:#fff; border-color:var(--g2); }
  .status { margin-left:auto; font-size:13px; color:var(--muted); }
  .notes { width:100%; margin-top:8px; padding:6px 8px; border:1px solid var(--line); border-radius:6px;
           font:inherit; font-size:13px; }
  .empty { text-align:center; color:var(--muted); padding:40px; }
  .pill { display:inline-block; padding:1px 7px; border-radius:99px; background:#eef1f4;
          font-size:12px; color:var(--muted); margin-right:4px; }
  .prelim { color:#7a5b00; background:#fff6d8; border:1px solid #f0dfa0; border-radius:6px;
            padding:5px 8px; margin-top:8px; font-size:13px; }
  kbd { background:#eef1f4; border:1px solid var(--line); border-radius:4px; padding:0 4px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Manual relevance judging — PRI Milestone 2</h1>
  <div class="muted">Pooled top-20 of Setup A and Setup B. Grade every candidate: 2 = highly relevant,
    1 = partially relevant, 0 = not relevant. Grades save in this browser; export when done.</div>
  <div class="toolbar">
    <label>Need <select id="qid"><option value="all">All needs</option></select></label>
    <label><input type="checkbox" id="unjudged"> Show unjudged only</label>
    <input type="text" id="search" placeholder="Search title or movie_id">
    <button id="load-prelim">Load preliminary grades</button>
    <button id="export">Export qrels.csv</button>
    <button id="clear">Clear all</button>
  </div>
  <div class="bar"><i id="progress"></i></div>
  <div class="toolbar muted" id="summary"></div>
</header>
<main id="main"></main>

<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const STORAGE_KEY = 'pri-m2-qrels-v1';
const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

function key(c) { return c.qid + '/' + c.docid; }
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); render(); }
function gradeOf(c) {
  const row = state[key(c)];
  if (!row || row.rel === null || row.rel === undefined || row.rel === '') return null;
  return Number(row.rel);
}
function notesOf(c) { return state[key(c)] ? state[key(c)].notes || '' : ''; }

function setGrade(c, rel) {
  state[key(c)] = { rel: String(rel), judge: 'manual', notes: notesOf(c) };
  save();
}
function setNotes(c, notes) {
  const prev = state[key(c)] || { rel: null, judge: 'manual' };
  state[key(c)] = { ...prev, notes };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

function filtered() {
  const qid = document.getElementById('qid').value;
  const unjudged = document.getElementById('unjudged').checked;
  const query = document.getElementById('search').value.trim().toLowerCase();
  return DATA.candidates.filter(c => {
    if (qid !== 'all' && c.qid !== qid) return false;
    if (unjudged && gradeOf(c) !== null) return false;
    if (query) {
      const hay = (c.title + ' ' + c.docid).toLowerCase();
      if (!hay.includes(query)) return false;
    }
    return true;
  });
}

function needBlock(qid) {
  const n = DATA.needs[qid];
  return `<div class="need"><h2>${qid} — ${escapeHtml(n.title)}</h2>
    <p><strong>Need:</strong> ${escapeHtml(n.need)}</p>
    <p><strong>Relevance criteria:</strong> ${escapeHtml(n.criteria)}</p></div>`;
}

function list(items) {
  if (!items || !items.length) return '';
  return '<ul>' + items.map(x => '<li>' + escapeHtml(x) + '</li>').join('') + '</ul>';
}

function card(c) {
  const g = gradeOf(c);
  const ranks = [];
  if (c.rank_A) ranks.push('A #' + c.rank_A);
  if (c.rank_B) ranks.push('B #' + c.rank_B);
  
  return `<article class="card ${g !== null ? 'done' : ''}" data-key="${escapeHtml(key(c))}">
    <h3>${escapeHtml(c.title)} (${escapeHtml(c.year)})</h3>
    <div class="meta"><span class="pill">movie_id ${escapeHtml(c.docid)}</span>
      ${ranks.join(' · ')} ${c.genres ? '· ' + escapeHtml(c.genres) : ''}</div>
    <div class="overview"><strong>Overview:</strong> ${escapeHtml(c.overview || 'n/a')}</div>
    ${c.plot_windows.length ? `<div class="evidence"><h4>Plot evidence</h4>${list(c.plot_windows)}</div>` : ''}
    ${c.review_windows.length ? `<div class="evidence"><h4>Review evidence</h4>${list(c.review_windows)}</div>` : ''}
    ${!c.plot_windows.length && !c.review_windows.length ? '<div class="muted" style="margin-top:8px">No query-term evidence found in plot or reviews.</div>' : ''}
    <div class="grades">
      <button class="grade ${g === 0 ? 'active' : ''}" data-rel="0">0 · not relevant</button>
      <button class="grade ${g === 1 ? 'active' : ''}" data-rel="1">1 · partial</button>
      <button class="grade ${g === 2 ? 'active' : ''}" data-rel="2">2 · highly relevant</button>
      <span class="status">${g === null ? 'unjudged' : 'judged: ' + g}</span>
    </div>
    <input class="notes" placeholder="Optional note (why?)" value="${escapeHtml(notesOf(c))}">
  </article>`;
}

function render() {
  const rows = filtered();
  const main = document.getElementById('main');
  const groups = {};
  rows.forEach(c => { (groups[c.qid] = groups[c.qid] || []).push(c); });
  main.innerHTML = Object.keys(groups).sort().map(qid =>
    needBlock(qid) + groups[qid].map(card).join('')
  ).join('') || '<div class="empty">No candidates match these filters.</div>';

  main.querySelectorAll('.grade').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = btn.closest('.card');
      const c = DATA.candidates.find(x => key(x) === card.dataset.key);
      setGrade(c, Number(btn.dataset.rel));
    });
  });
  main.querySelectorAll('.notes').forEach(input => {
    input.addEventListener('input', () => {
      const card = input.closest('.card');
      const c = DATA.candidates.find(x => key(x) === card.dataset.key);
      setNotes(c, input.value);
    });
  });

  const done = DATA.candidates.filter(c => gradeOf(c) !== null).length;
  const total = DATA.candidates.length;
  document.getElementById('progress').style.width = (100 * done / total) + '%';
  const per = {};
  DATA.candidates.forEach(c => {
    per[c.qid] = per[c.qid] || { done: 0, total: 0 };
    per[c.qid].total++;
    if (gradeOf(c) !== null) per[c.qid].done++;
  });
  document.getElementById('summary').textContent =
    `Judged ${done}/${total} · ` + Object.keys(per).sort().map(q =>
      `${q} ${per[q].done}/${per[q].total}`).join(' · ');
}

function csvEscape(v) {
  const s = String(v == null ? '' : v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCsv() {
  const header = ['qid','docid','title','year','rel','judge','notes'];
  const lines = [header.join(',')];
  DATA.candidates.forEach(c => {
    const row = state[key(c)];
    if (!row || row.rel === null || row.rel === undefined) return;
    lines.push([
      c.qid, c.docid, c.title, c.year, row.rel, row.judge || 'manual', row.notes || ''
    ].map(csvEscape).join(','));
  });
  const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'qrels.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById('qid').addEventListener('change', render);
document.getElementById('unjudged').addEventListener('change', render);
document.getElementById('search').addEventListener('input', render);
document.getElementById('export').addEventListener('click', exportCsv);
document.getElementById('load-prelim').addEventListener('click', () => {
  if (!confirm('Load the preliminary grades for all still-ungraded candidates?')) return;
  DATA.candidates.forEach(c => {
    if (gradeOf(c) === null && c.preliminary !== '') {
      state[key(c)] = { rel: c.preliminary, judge: 'preliminary-loaded', notes: c.preliminary_notes || '' };
    }
  });
  save();
});
document.getElementById('clear').addEventListener('click', () => {
  if (!confirm('Clear all grades from this browser? Export first if you need them.')) return;
  Object.keys(state).forEach(k => delete state[k]);
  save();
});

DATA.candidates.forEach(c => {
  if (!document.querySelector(`#qid option[value="${c.qid}"]`)) {
    const opt = document.createElement('option');
    opt.value = c.qid;
    opt.textContent = c.qid + ' — ' + DATA.needs[c.qid].title;
    document.getElementById('qid').appendChild(opt);
  }
});
render();
</script>
</body>
</html>
